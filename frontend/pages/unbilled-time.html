<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unbilled Time - Case Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Select2 for searchable dropdowns -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="../css/select2-tailwind.css">
    <script src="../js/nav.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/searchable-select.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <div id="app-nav"></div>
    <script>renderNav('unbilled');</script>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header & Summary -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">Unbilled Time</h2>
                    <p class="text-sm text-gray-600 mt-1">Review and manage unbilled time entries</p>
                </div>
                <div class="flex space-x-3">
                    <button onclick="markSelectedAsBilled()" class="bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded">
                        <i class="fas fa-check mr-2"></i>Mark as Billed
                    </button>
                    <button onclick="createInvoiceFromSelected()" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded">
                        <i class="fas fa-file-invoice mr-2"></i>Create Invoice
                    </button>
                </div>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-orange-100 rounded-md p-3">
                            <i class="fas fa-clock text-orange-600 text-xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">Total Hours</p>
                            <p class="text-2xl font-bold text-gray-900" id="totalHours">0.0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-blue-100 rounded-md p-3">
                            <i class="fas fa-dollar-sign text-blue-600 text-xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">Total Amount</p>
                            <p class="text-2xl font-bold text-gray-900" id="totalAmount">$0.00</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-purple-100 rounded-md p-3">
                            <i class="fas fa-users text-purple-600 text-xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">Clients</p>
                            <p class="text-2xl font-bold text-gray-900" id="totalClients">0</p>
                        </div>
                    </div>
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex items-center">
                        <div class="flex-shrink-0 bg-green-100 rounded-md p-3">
                            <i class="fas fa-file-alt text-green-600 text-xl"></i>
                        </div>
                        <div class="ml-4">
                            <p class="text-sm font-medium text-gray-500">Entries</p>
                            <p class="text-2xl font-bold text-gray-900" id="totalEntries">0</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Client</label>
                    <select id="clientFilter" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        <option value="">All Clients</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Matter</label>
                    <select id="matterFilter" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        <option value="">All Matters</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date From</label>
                    <input type="date" id="dateFrom" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date To</label>
                    <input type="date" id="dateTo" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                </div>
            </div>
            <div class="mt-4 flex justify-end">
                <button onclick="applyFilters()" class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded">
                    <i class="fas fa-filter mr-2"></i>Apply Filters
                </button>
            </div>
        </div>

        <!-- View Toggle -->
        <div class="bg-white rounded-lg shadow mb-6 p-4">
            <div class="flex items-center space-x-4">
                <label class="text-sm font-medium text-gray-700">View:</label>
                <div class="flex space-x-2">
                    <button id="viewByClient" onclick="switchView('client')" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md">
                        By Client
                    </button>
                    <button id="viewByEntry" onclick="switchView('entry')" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
                        All Entries
                    </button>
                </div>
            </div>
        </div>

        <!-- Client Grouped View -->
        <div id="clientView" class="space-y-4">
            <div class="bg-white shadow rounded-lg p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Clients with Unbilled Time</h3>
                <div id="clientGroupList" class="space-y-3">
                    <p class="text-gray-500 text-center py-4">Loading...</p>
                </div>
            </div>
        </div>

        <!-- Unbilled Time Table -->
        <div id="entryView" class="bg-white shadow rounded-lg" style="display: none;">
            <div class="px-6 py-4 border-b">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-medium text-gray-900">Unbilled Time Entries</h3>
                    <div class="flex items-center space-x-4">
                        <label class="flex items-center text-sm text-gray-700">
                            <input type="checkbox" id="selectAll" class="mr-2 rounded" onchange="toggleSelectAll()">
                            Select All
                        </label>
                        <span class="text-sm text-gray-600" id="selectedCount">0 selected</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <div class="flex-1 relative">
                        <input type="text" id="searchInput" placeholder="Search entries..." class="w-full border border-gray-300 rounded-md pl-10 pr-3 py-2 text-sm">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                    <button onclick="clearSearch()" class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50">
                        Clear
                    </button>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">
                                <input type="checkbox" class="rounded" style="visibility: hidden;">
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-gray-100" onclick="sortTable('entry_date')">
                                Date <i class="fas fa-sort ml-1"></i>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-gray-100" onclick="sortTable('client_name')">
                                Client <i class="fas fa-sort ml-1"></i>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-gray-100" onclick="sortTable('matter_name')">
                                Matter <i class="fas fa-sort ml-1"></i>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-gray-100" onclick="sortTable('description')">
                                Description <i class="fas fa-sort ml-1"></i>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-gray-100" onclick="sortTable('duration_minutes')">
                                Hours <i class="fas fa-sort ml-1"></i>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-gray-100" onclick="sortTable('hourly_rate')">
                                Rate <i class="fas fa-sort ml-1"></i>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase cursor-pointer hover:bg-gray-100" onclick="sortTable('amount')">
                                Amount <i class="fas fa-sort ml-1"></i>
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="unbilledTableBody" class="bg-white divide-y divide-gray-200">
                        <tr>
                            <td colspan="9" class="px-6 py-8 text-center text-gray-500">Loading unbilled time...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        let allEntries = [];
        let filteredEntries = [];
        let selectedEntries = new Set();
        let allClients = [];
        let allMatters = [];
        let sortColumn = 'entry_date';
        let sortDirection = 'desc';
        let searchTerm = '';
        let currentView = 'client';

        async function loadClients() {
            try {
                allClients = await api.get('/clients');
                const select = document.getElementById('clientFilter');
                select.innerHTML = '<option value="">All Clients</option>' +
                    allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        async function loadMatters() {
            try {
                allMatters = await api.get('/matters');
                const select = document.getElementById('matterFilter');
                select.innerHTML = '<option value="">All Matters</option>' +
                    allMatters.map(m => `<option value="${m.id}">${m.client_name} - ${m.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading matters:', error);
            }
        }

        async function loadUnbilledTime() {
            try {
                // Get all unbilled time entries
                const entries = await api.get('/time-entries', { billed: false });
                allEntries = entries;
                filteredEntries = entries;

                if (currentView === 'client') {
                    renderClientView();
                } else {
                    renderTable();
                }
                updateSummary();
            } catch (error) {
                console.error('Error loading unbilled time:', error);
                document.getElementById('unbilledTableBody').innerHTML =
                    '<tr><td colspan="9" class="px-6 py-8 text-center text-red-500">Error loading data</td></tr>';
            }
        }

        function switchView(view) {
            currentView = view;

            // Update button styles
            if (view === 'client') {
                document.getElementById('viewByClient').className = 'px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md';
                document.getElementById('viewByEntry').className = 'px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50';
                document.getElementById('clientView').style.display = 'block';
                document.getElementById('entryView').style.display = 'none';
                renderClientView();
            } else {
                document.getElementById('viewByClient').className = 'px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50';
                document.getElementById('viewByEntry').className = 'px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md';
                document.getElementById('clientView').style.display = 'none';
                document.getElementById('entryView').style.display = 'block';
                renderTable();
            }
        }

        function renderClientView() {
            const container = document.getElementById('clientGroupList');

            // Group entries by client
            const clientGroups = {};
            filteredEntries.forEach(entry => {
                if (!clientGroups[entry.client_id]) {
                    clientGroups[entry.client_id] = {
                        clientId: entry.client_id,
                        clientName: entry.client_name,
                        entries: [],
                        totalHours: 0,
                        totalAmount: 0,
                        matters: new Set()
                    };
                }
                clientGroups[entry.client_id].entries.push(entry);
                clientGroups[entry.client_id].totalHours += entry.duration_minutes / 60;
                clientGroups[entry.client_id].totalAmount += parseFloat(entry.amount || 0);
                clientGroups[entry.client_id].matters.add(entry.matter_name);
            });

            const clients = Object.values(clientGroups);

            if (clients.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-8">No clients with unbilled time</p>';
                return;
            }

            container.innerHTML = clients.map(client => `
                <div class="border rounded-lg p-4 hover:bg-gray-50 cursor-pointer transition-colors" onclick="viewClientDetails(${client.clientId})">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <h4 class="font-medium text-gray-900 text-lg">${client.clientName}</h4>
                            <p class="text-sm text-gray-600 mt-1">${client.entries.length} entries across ${client.matters.size} matter(s)</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold text-gray-900">${formatCurrency(client.totalAmount)}</p>
                            <p class="text-sm text-gray-600">${client.totalHours.toFixed(1)} hours</p>
                        </div>
                    </div>
                    <div class="mt-3 flex justify-end space-x-2">
                        <button onclick="event.stopPropagation(); previewClientInvoice(${client.clientId})" class="px-3 py-1 text-sm bg-blue-500 hover:bg-blue-600 text-white rounded">
                            <i class="fas fa-eye mr-1"></i>Preview
                        </button>
                        <button onclick="event.stopPropagation(); createClientInvoice(${client.clientId})" class="px-3 py-1 text-sm bg-green-500 hover:bg-green-600 text-white rounded">
                            <i class="fas fa-file-invoice mr-1"></i>Create Invoice
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function viewClientDetails(clientId) {
            const client = filteredEntries.find(e => e.client_id === clientId);
            const clientEntries = filteredEntries.filter(e => e.client_id === clientId);

            const details = clientEntries.map(e =>
                `${formatDate(e.entry_date)} - ${e.matter_name}: ${(e.duration_minutes/60).toFixed(2)}h @ ${formatCurrency(e.hourly_rate)} = ${formatCurrency(e.amount)}\n${e.description}`
            ).join('\n\n');

            const totalHours = clientEntries.reduce((sum, e) => sum + (e.duration_minutes / 60), 0);
            const totalAmount = clientEntries.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);

            alert(`${client.clientName}\n\nTotal: ${formatCurrency(totalAmount)} (${totalHours.toFixed(1)} hours)\nEntries: ${clientEntries.length}\n\n${details}`);
        }

        async function previewClientInvoice(clientId) {
            const clientEntries = filteredEntries.filter(e => e.client_id === clientId);
            const client = clientEntries[0];

            // Group by matter
            const matterGroups = {};
            clientEntries.forEach(entry => {
                if (!matterGroups[entry.matter_id]) {
                    matterGroups[entry.matter_id] = {
                        matterName: entry.matter_name,
                        entries: []
                    };
                }
                matterGroups[entry.matter_id].entries.push(entry);
            });

            let preview = `INVOICE PREVIEW\n`;
            preview += `================\n\n`;
            preview += `Client: ${client.clientName}\n`;
            preview += `Date: ${new Date().toLocaleDateString()}\n`;
            preview += `Due: Upon Receipt\n\n`;

            let grandTotal = 0;

            for (const [matterId, matter] of Object.entries(matterGroups)) {
                preview += `\nMatter: ${matter.matterName}\n`;
                preview += `${'-'.repeat(50)}\n`;

                matter.entries.forEach(entry => {
                    const hours = (entry.duration_minutes / 60).toFixed(2);
                    preview += `${formatDate(entry.entry_date)}: ${truncate(entry.description, 30)}\n`;
                    preview += `  ${hours} hrs @ ${formatCurrency(entry.hourly_rate)} = ${formatCurrency(entry.amount)}\n`;
                    grandTotal += parseFloat(entry.amount);
                });
            }

            preview += `\n${'='.repeat(50)}\n`;
            preview += `TOTAL DUE: ${formatCurrency(grandTotal)}\n`;
            preview += `${'='.repeat(50)}\n`;

            alert(preview);
        }

        async function createClientInvoice(clientId) {
            const clientEntries = filteredEntries.filter(e => e.client_id === clientId);
            const client = clientEntries[0];

            // Group by matter to check if multiple matters
            const matterIds = [...new Set(clientEntries.map(e => e.matter_id))];

            if (matterIds.length > 1) {
                if (!confirm(`This client has unbilled time across ${matterIds.length} matters. Create separate invoices for each matter?`)) {
                    return;
                }

                // Create invoice for each matter
                for (const matterId of matterIds) {
                    const matterEntries = clientEntries.filter(e => e.matter_id === matterId);
                    await createMatterInvoice(matterId, clientId, matterEntries.map(e => e.id));
                }

                alert(`Created ${matterIds.length} invoices`);
                loadUnbilledTime();
            } else {
                // Single matter - create one invoice
                const matterId = matterIds[0];
                await createMatterInvoice(matterId, clientId, clientEntries.map(e => e.id));
                alert('Invoice created successfully!');
                loadUnbilledTime();
            }
        }

        async function createMatterInvoice(matterId, clientId, entryIds) {
            try {
                const response = await fetch('http://localhost:3000/api/v1/invoices', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        matter_id: matterId,
                        client_id: clientId,
                        time_entry_ids: entryIds,
                        issue_date: new Date().toISOString().split('T')[0],
                        payment_terms: 'Due upon receipt'
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to create invoice');
                }

                const invoice = await response.json();
                return invoice;
            } catch (error) {
                console.error('Error creating invoice:', error);
                throw error;
            }
        }

        function applyFilters() {
            const clientId = document.getElementById('clientFilter').value;
            const matterId = document.getElementById('matterFilter').value;
            const dateFrom = document.getElementById('dateFrom').value;
            const dateTo = document.getElementById('dateTo').value;

            filteredEntries = allEntries.filter(entry => {
                // Apply filters
                if (clientId && entry.client_id != clientId) return false;
                if (matterId && entry.matter_id != matterId) return false;
                if (dateFrom && entry.entry_date < dateFrom) return false;
                if (dateTo && entry.entry_date > dateTo) return false;

                // Apply search
                if (searchTerm) {
                    const search = searchTerm.toLowerCase();
                    const matchesSearch =
                        (entry.client_name && entry.client_name.toLowerCase().includes(search)) ||
                        (entry.matter_name && entry.matter_name.toLowerCase().includes(search)) ||
                        (entry.description && entry.description.toLowerCase().includes(search));
                    if (!matchesSearch) return false;
                }

                return true;
            });

            // Apply sorting
            sortEntries();

            renderTable();
            updateSummary();
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            sortEntries();
            renderTable();
        }

        function sortEntries() {
            filteredEntries.sort((a, b) => {
                let aVal = a[sortColumn];
                let bVal = b[sortColumn];

                // Handle null/undefined
                if (aVal == null) aVal = '';
                if (bVal == null) bVal = '';

                // Convert to lowercase for string comparison
                if (typeof aVal === 'string') aVal = aVal.toLowerCase();
                if (typeof bVal === 'string') bVal = bVal.toLowerCase();

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function performSearch() {
            searchTerm = document.getElementById('searchInput').value;
            applyFilters();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchTerm = '';
            applyFilters();
        }

        function renderTable() {
            const tbody = document.getElementById('unbilledTableBody');

            if (filteredEntries.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="px-6 py-8 text-center text-gray-500">No unbilled time entries found</td></tr>';
                return;
            }

            tbody.innerHTML = filteredEntries.map(entry => {
                const hours = (entry.duration_minutes / 60).toFixed(2);
                const checked = selectedEntries.has(entry.id) ? 'checked' : '';

                return `
                    <tr class="hover:bg-gray-50 ${selectedEntries.has(entry.id) ? 'bg-blue-50' : ''}">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <input type="checkbox" ${checked} onchange="toggleEntry('${entry.id}')" class="rounded entry-checkbox">
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${formatDate(entry.entry_date)}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">${entry.client_name || '-'}</td>
                        <td class="px-6 py-4 text-sm text-gray-900">${entry.matter_name || '-'}</td>
                        <td class="px-6 py-4 text-sm text-gray-700">${truncate(entry.description, 60)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${hours}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">${formatCurrency(entry.hourly_rate)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${formatCurrency(entry.amount)}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <button onclick="viewEntry('${entry.id}')" class="text-blue-600 hover:text-blue-900 mr-3">View</button>
                            <button onclick="deleteEntry('${entry.id}')" class="text-red-600 hover:text-red-900">Delete</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function updateSummary() {
            const totalHours = filteredEntries.reduce((sum, e) => sum + (e.duration_minutes / 60), 0);
            const totalAmount = filteredEntries.reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
            const uniqueClients = new Set(filteredEntries.map(e => e.client_id)).size;

            document.getElementById('totalHours').textContent = totalHours.toFixed(1);
            document.getElementById('totalAmount').textContent = formatCurrency(totalAmount);
            document.getElementById('totalClients').textContent = uniqueClients;
            document.getElementById('totalEntries').textContent = filteredEntries.length;
        }

        function toggleEntry(entryId) {
            if (selectedEntries.has(entryId)) {
                selectedEntries.delete(entryId);
            } else {
                selectedEntries.add(entryId);
            }
            updateSelectedCount();
            renderTable();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAll').checked;
            selectedEntries.clear();

            if (selectAll) {
                filteredEntries.forEach(entry => selectedEntries.add(entry.id));
            }

            updateSelectedCount();
            renderTable();
        }

        function updateSelectedCount() {
            document.getElementById('selectedCount').textContent = `${selectedEntries.size} selected`;

            // Update "Select All" checkbox state
            const selectAllCheckbox = document.getElementById('selectAll');
            if (selectedEntries.size === 0) {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = false;
            } else if (selectedEntries.size === filteredEntries.length) {
                selectAllCheckbox.checked = true;
                selectAllCheckbox.indeterminate = false;
            } else {
                selectAllCheckbox.checked = false;
                selectAllCheckbox.indeterminate = true;
            }
        }

        async function markSelectedAsBilled() {
            if (selectedEntries.size === 0) {
                alert('Please select entries to mark as billed');
                return;
            }

            if (!confirm(`Mark ${selectedEntries.size} entries as billed?`)) {
                return;
            }

            try {
                // Mark each selected entry as billed
                for (const entryId of selectedEntries) {
                    await api.patch(`/time-entries/${entryId}`, { billed: true });
                }

                alert(`${selectedEntries.size} entries marked as billed`);
                selectedEntries.clear();
                loadUnbilledTime();
            } catch (error) {
                alert('Error marking entries as billed: ' + error.message);
            }
        }

        async function createInvoiceFromSelected() {
            if (selectedEntries.size === 0) {
                alert('Please select entries to create an invoice');
                return;
            }

            // Get the selected entries
            const selectedEntryObjects = allEntries.filter(e => selectedEntries.has(e.id));

            // Validate all entries are from the same matter
            const matterIds = [...new Set(selectedEntryObjects.map(e => e.matter_id))];
            if (matterIds.length > 1) {
                alert('All selected entries must be from the same matter to create an invoice.');
                return;
            }

            const matterId = matterIds[0];
            const entry = selectedEntryObjects[0];
            const clientId = entry.client_id;

            if (!matterId || !clientId) {
                alert('Unable to determine matter or client for selected entries.');
                return;
            }

            if (!confirm(`Create invoice for ${selectedEntries.size} time entries from ${entry.matter_name}?`)) {
                return;
            }

            try {
                // Create invoice with selected time entries
                const response = await fetch('http://localhost:3000/api/v1/invoices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        matter_id: matterId,
                        client_id: clientId,
                        time_entry_ids: Array.from(selectedEntries),
                        issue_date: new Date().toISOString().split('T')[0],
                        payment_terms: 'Due upon receipt'
                    })
                });

                const invoice = await response.json();
                alert('Invoice created successfully!');

                // Redirect to invoice detail page
                window.location.href = `invoice-detail.html?id=${invoice.id}`;
            } catch (error) {
                console.error('Error creating invoice:', error);
                alert('Failed to create invoice');
            }
        }

        async function viewEntry(entryId) {
            const entry = allEntries.find(e => e.id == entryId);
            if (entry) {
                alert(`Entry Details:\n\nDate: ${entry.entry_date}\nMatter: ${entry.matter_name}\nHours: ${(entry.duration_minutes/60).toFixed(2)}\nAmount: ${formatCurrency(entry.amount)}\n\nDescription:\n${entry.description}`);
            }
        }

        async function deleteEntry(entryId) {
            if (!confirm('Are you sure you want to delete this time entry?')) return;

            try {
                await api.delete(`/time-entries/${entryId}`);
                loadUnbilledTime();
            } catch (error) {
                alert('Error deleting entry: ' + error.message);
            }
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount || 0);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString();
        }

        function truncate(str, length) {
            return str && str.length > length ? str.substring(0, length) + '...' : str;
        }

        // Event listeners
        document.getElementById('clientFilter').addEventListener('change', () => {
            // When client changes, filter matters
            const clientId = document.getElementById('clientFilter').value;
            const matterSelect = document.getElementById('matterFilter');

            if (clientId) {
                const filteredMatters = allMatters.filter(m => m.client_id == clientId);
                matterSelect.innerHTML = '<option value="">All Matters</option>' +
                    filteredMatters.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
            } else {
                matterSelect.innerHTML = '<option value="">All Matters</option>' +
                    allMatters.map(m => `<option value="${m.id}">${m.client_name} - ${m.name}</option>`).join('');
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadClients();
            loadMatters();
            loadUnbilledTime();

            // Search on input
            document.getElementById('searchInput').addEventListener('input', performSearch);
        });
    </script>
</body>
</html>
