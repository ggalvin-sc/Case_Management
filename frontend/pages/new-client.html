<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Client - Case Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Select2 for searchable dropdowns -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="../css/select2-tailwind.css">
    <script src="../js/nav.js"></script>
    <script src="../js/searchable-select.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex flex-col">
        <!-- Navigation -->
        <div id="app-nav"></div>
        <script>renderNav('');</script>

        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="matters.html" class="text-gray-600 hover:text-gray-900">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                    </a>
                    <h1 class="text-2xl font-bold text-gray-900">New Client</h1>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-3xl w-full mx-auto px-6 py-8">
            <div class="bg-white rounded-lg shadow p-8">
                <form id="clientForm" class="space-y-6">
                    <!-- Client Name -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">
                            Client Name <span class="text-red-500">*</span>
                        </label>
                        <input
                            type="text"
                            id="name"
                            required
                            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                            placeholder="Enter client name"
                        >
                    </div>

                    <!-- Client Number -->
                    <div>
                        <label for="clientNumber" class="block text-sm font-medium text-gray-700 mb-1">
                            Client Number
                        </label>
                        <input
                            type="text"
                            id="clientNumber"
                            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                            placeholder="Auto-generated if left blank"
                        >
                        <p class="mt-1 text-sm text-gray-500">Leave blank to auto-generate (CL-XXXXX)</p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email
                        </label>
                        <input
                            type="email"
                            id="email"
                            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                            placeholder="client@example.com"
                        >
                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                            Phone
                        </label>
                        <input
                            type="tel"
                            id="phone"
                            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                            placeholder="(555) 123-4567"
                        >
                    </div>

                    <!-- Address -->
                    <div>
                        <label for="address" class="block text-sm font-medium text-gray-700 mb-1">
                            Address Line 1
                        </label>
                        <input
                            type="text"
                            id="address"
                            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                            placeholder="Street address"
                        >
                    </div>

                    <!-- Address Line 2 -->
                    <div>
                        <label for="addressLine2" class="block text-sm font-medium text-gray-700 mb-1">
                            Address Line 2
                        </label>
                        <input
                            type="text"
                            id="addressLine2"
                            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                            placeholder="Apartment, suite, etc. (optional)"
                        >
                    </div>

                    <!-- City, State, ZIP -->
                    <div class="grid grid-cols-3 gap-4">
                        <div class="col-span-1">
                            <label for="city" class="block text-sm font-medium text-gray-700 mb-1">
                                City
                            </label>
                            <input
                                type="text"
                                id="city"
                                class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                                placeholder="City"
                            >
                        </div>
                        <div class="col-span-1">
                            <label for="state" class="block text-sm font-medium text-gray-700 mb-1">
                                State
                            </label>
                            <input
                                type="text"
                                id="state"
                                class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                                placeholder="State"
                                maxlength="2"
                            >
                        </div>
                        <div class="col-span-1">
                            <label for="zipCode" class="block text-sm font-medium text-gray-700 mb-1">
                                ZIP Code
                            </label>
                            <input
                                type="text"
                                id="zipCode"
                                class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-2-blue-500"
                                placeholder="ZIP"
                            >
                        </div>
                    </div>

                    <!-- Country -->
                    <div>
                        <label for="country" class="block text-sm font-medium text-gray-700 mb-1">
                            Country
                        </label>
                        <input
                            type="text"
                            id="country"
                            value="USA"
                            class="w-full border rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500"
                            placeholder="Country"
                        >
                    </div>

                    <!-- Default Hourly Rate -->
                    <div>
                        <label for="defaultRate" class="block text-sm font-medium text-gray-700 mb-1">
                            Default Hourly Rate <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute left-3 top-2 text-gray-500">$</span>
                            <input
                                type="number"
                                id="defaultRate"
                                step="0.01"
                                min="0"
                                value="350"
                                required
                                class="w-full border rounded-lg pl-8 pr-4 py-2 focus:ring-2 focus:ring-blue-500"
                            >
                        </div>
                        <p class="mt-1 text-sm text-gray-500">This rate will be used for all matters unless overridden</p>
                    </div>

                    <!-- Actions -->
                    <div class="flex justify-end space-x-3 pt-4 border-t">
                        <button
                            type="button"
                            onclick="window.location.href='matters.html'"
                            class="px-6 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 border rounded-lg"
                        >
                            Cancel
                        </button>
                        <button
                            type="submit"
                            class="px-6 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg"
                        >
                            Create Client
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000/api/v1';

        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                client_number: document.getElementById('clientNumber').value || null,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                address_line2: document.getElementById('addressLine2').value,
                city: document.getElementById('city').value,
                state: document.getElementById('state').value,
                zip_code: document.getElementById('zipCode').value,
                country: document.getElementById('country').value,
                default_hourly_rate: parseFloat(document.getElementById('defaultRate').value)
            };

            try {
                const response = await fetch(`${API_BASE}/clients`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    const client = await response.json();
                    alert(`Client "${client.name}" created successfully!\nClient Number: ${client.client_number}\n\nDefault rate: $${client.default_hourly_rate}/hr`);
                    window.location.href = 'matters.html';
                } else {
                    const error = await response.json();
                    alert('Error creating client: ' + (error.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to create client. Please try again.');
            }
        });
    </script>
</body>
</html>
