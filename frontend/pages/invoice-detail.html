<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Detail - Case Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/invoice-templates.js"></script>
    <style>
        @media print {
            #app-nav, header, #templateSelector { display: none; }
            body { background: white; }
            main { max-width: 100%; padding: 0; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex flex-col">
        <!-- Navigation -->
        <div id="app-nav"></div>
        <script>renderNav('invoices');</script>

        <!-- Header -->
        <header class="bg-white shadow-sm border-b">
            <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <a href="invoices.html" class="text-gray-600 hover:text-gray-900">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                    </a>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900" id="invoiceTitle">Invoice</h1>
                        <p class="text-sm text-gray-500" id="invoiceSubtitle"></p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Template Selector -->
                    <div id="templateSelector" class="flex items-center space-x-2">
                        <label class="text-sm text-gray-600">Template:</label>
                        <select id="templateSelect" onchange="changeTemplate()" class="border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="classic">Classic</option>
                            <option value="modern">Modern</option>
                            <option value="detailed">Detailed</option>
                        </select>
                    </div>
                    <div id="actionButtons">
                        <!-- Populated by JavaScript based on status -->
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8">
            <!-- Invoice Preview -->
            <div class="bg-white rounded-lg shadow p-8" id="invoicePreview">
                <!-- Template will be rendered here -->
            </div>
        </main>
    </div>

    <!-- Record Payment Modal -->
    <div id="paymentModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Record Payment</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Payment Amount</label>
                        <input type="number" id="paymentAmount" step="0.01" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Payment Date</label>
                        <input type="date" id="paymentDate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-3">
                    <button onclick="closePaymentModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 border rounded-lg">
                        Cancel
                    </button>
                    <button onclick="submitPayment()" class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg">
                        Record Payment
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full mx-4">
            <div class="p-6">
                <h3 class="text-lg font-medium text-gray-900 mb-4">Edit Invoice</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
                        <input type="date" id="editDueDate" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tax Rate (%)</label>
                        <input type="number" id="editTaxRate" step="0.01" class="w-full border rounded-lg px-3 py-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
                        <textarea id="editNotes" rows="3" class="w-full border rounded-lg px-3 py-2"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Payment Terms</label>
                        <textarea id="editTerms" rows="2" class="w-full border rounded-lg px-3 py-2"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end space-x-3">
                    <button onclick="closeEditModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 border rounded-lg">
                        Cancel
                    </button>
                    <button onclick="submitEdit()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        checkAuth();

        const urlParams = new URLSearchParams(window.location.search);
        const invoiceId = urlParams.get('id');

        let invoice = null;
        let currentTemplate = 'classic';

        // Utility functions
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount || 0);
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function getStatusBadge(status) {
            const badges = {
                'draft': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-gray-100 text-gray-800">Draft</span>',
                'review': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-blue-100 text-blue-800">Review</span>',
                'finalized': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-purple-100 text-purple-800">Finalized</span>',
                'sent': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-yellow-100 text-yellow-800">Sent</span>',
                'paid': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-green-100 text-green-800">Paid</span>',
                'void': '<span class="px-2 py-1 text-xs font-medium rounded-full bg-red-100 text-red-800">Void</span>'
            };
            return badges[status] || status;
        }

        // API calls
        async function fetchInvoice() {
            try {
                invoice = await api.get(`/invoices/${invoiceId}`);

                // Set default template from firm settings
                if (invoice.firm && invoice.firm.default_invoice_template) {
                    currentTemplate = invoice.firm.default_invoice_template;
                    document.getElementById('templateSelect').value = currentTemplate;
                }

                renderInvoice();
            } catch (error) {
                console.error('Error fetching invoice:', error);
                if (error.message.includes('404') || error.message.includes('not found')) {
                    alert('Invoice not found. Redirecting to invoice list...');
                    setTimeout(() => window.location.href = 'invoices.html', 2000);
                } else {
                    alert('Failed to load invoice: ' + error.message);
                }
            }
        }

        // Template change handler
        function changeTemplate() {
            currentTemplate = document.getElementById('templateSelect').value;
            renderInvoice();
        }

        async function finalizeInvoice() {
            if (!confirm('Finalize this invoice? This will lock the invoice and mark items as billed.')) return;

            try {
                invoice = await api.post(`/invoices/${invoiceId}/finalize`, {});
                renderInvoice();
                alert('Invoice finalized successfully!');
            } catch (error) {
                console.error('Error finalizing invoice:', error);
                alert('Failed to finalize invoice: ' + error.message);
            }
        }

        async function sendInvoice() {
            if (!confirm('Mark this invoice as sent?')) return;

            try {
                invoice = await api.post(`/invoices/${invoiceId}/send`, {});
                renderInvoice();
                alert('Invoice marked as sent!');
            } catch (error) {
                console.error('Error sending invoice:', error);
                alert('Failed to send invoice: ' + error.message);
            }
        }

        function openPaymentModal() {
            document.getElementById('paymentModal').classList.remove('hidden');
            document.getElementById('paymentAmount').value = invoice.total_amount - (invoice.paid_amount || 0);
            document.getElementById('paymentDate').value = new Date().toISOString().split('T')[0];
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').classList.add('hidden');
        }

        async function submitPayment() {
            const amount = parseFloat(document.getElementById('paymentAmount').value);
            const paymentDate = document.getElementById('paymentDate').value;

            if (!amount || amount <= 0) {
                alert('Please enter a valid payment amount');
                return;
            }

            try {
                invoice = await api.post(`/invoices/${invoiceId}/payment`, {
                    amount,
                    payment_date: paymentDate
                });
                closePaymentModal();
                renderInvoice();
                alert('Payment recorded successfully!');
            } catch (error) {
                console.error('Error recording payment:', error);
                alert('Failed to record payment: ' + error.message);
            }
        }

        function openEditModal() {
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editDueDate').value = invoice.due_date || '';
            document.getElementById('editTaxRate').value = (invoice.tax_rate || 0) * 100;
            document.getElementById('editNotes').value = invoice.notes || '';
            document.getElementById('editTerms').value = invoice.payment_terms || '';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function submitEdit() {
            const updates = {
                due_date: document.getElementById('editDueDate').value,
                tax_rate: parseFloat(document.getElementById('editTaxRate').value) / 100,
                notes: document.getElementById('editNotes').value,
                payment_terms: document.getElementById('editTerms').value
            };

            try {
                invoice = await api.patch(`/invoices/${invoiceId}`, updates);
                closeEditModal();
                await fetchInvoice(); // Refresh to get recalculated totals
                alert('Invoice updated successfully!');
            } catch (error) {
                console.error('Error updating invoice:', error);
                alert('Failed to update invoice: ' + error.message);
            }
        }

        async function voidInvoice() {
            if (!confirm('Void this invoice? This action cannot be undone.')) return;

            try {
                invoice = await api.patch(`/invoices/${invoiceId}/status`, { status: 'void' });
                renderInvoice();
                alert('Invoice voided');
            } catch (error) {
                console.error('Error voiding invoice:', error);
                alert('Failed to void invoice: ' + error.message);
            }
        }

        async function deleteInvoice() {
            if (!confirm('Delete this draft invoice? This action cannot be undone.')) return;

            try {
                await api.delete(`/invoices/${invoiceId}`);
                alert('Invoice deleted');
                window.location.href = 'invoices.html';
            } catch (error) {
                console.error('Error deleting invoice:', error);
                alert('Failed to delete invoice: ' + error.message);
            }
        }

        async function setToReview() {
            if (!confirm('Move this invoice to review?')) return;

            try {
                invoice = await api.patch(`/invoices/${invoiceId}/status`, { status: 'review' });
                renderInvoice();
                alert('Invoice moved to review');
            } catch (error) {
                console.error('Error updating invoice status:', error);
                alert('Failed to update invoice: ' + error.message);
            }
        }

        // Rendering
        function renderInvoice() {
            // Update title
            const invoiceNumber = invoice.invoice_number || `Draft #${invoice.id}`;
            document.getElementById('invoiceTitle').textContent = invoiceNumber;
            document.getElementById('invoiceSubtitle').textContent = invoice.matter_name;

            // Render invoice using selected template
            const invoicePreview = document.getElementById('invoicePreview');
            invoicePreview.innerHTML = InvoiceTemplates.render(invoice, currentTemplate);

            // Action buttons based on status
            renderActionButtons();
        }

        function renderActionButtons() {
            const container = document.getElementById('actionButtons');
            let buttons = '';

            switch (invoice.status) {
                case 'draft':
                    buttons = `
                        <button onclick="openEditModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 border rounded-lg">
                            Edit
                        </button>
                        <button onclick="setToReview()" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg">
                            Move to Review
                        </button>
                        <button onclick="deleteInvoice()" class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 border border-red-600 rounded-lg">
                            Delete
                        </button>
                    `;
                    break;
                case 'review':
                    buttons = `
                        <button onclick="openEditModal()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 border rounded-lg">
                            Edit
                        </button>
                        <button onclick="finalizeInvoice()" class="px-4 py-2 text-sm font-medium text-white bg-purple-600 hover:bg-purple-700 rounded-lg">
                            Finalize Invoice
                        </button>
                    `;
                    break;
                case 'finalized':
                    buttons = `
                        <button onclick="sendInvoice()" class="px-4 py-2 text-sm font-medium text-white bg-yellow-600 hover:bg-yellow-700 rounded-lg">
                            Mark as Sent
                        </button>
                        <button onclick="voidInvoice()" class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 border border-red-600 rounded-lg">
                            Void
                        </button>
                    `;
                    break;
                case 'sent':
                    buttons = `
                        <button id="record-payment-btn" onclick="openPaymentModal()" class="px-4 py-2 text-sm font-medium text-white bg-green-600 hover:bg-green-700 rounded-lg">
                            Record Payment
                        </button>
                        <button onclick="voidInvoice()" class="px-4 py-2 text-sm font-medium text-red-600 hover:bg-red-50 border border-red-600 rounded-lg">
                            Void
                        </button>
                    `;
                    break;
                case 'paid':
                    buttons = `
                        <button onclick="window.print()" class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 border rounded-lg">
                            Print
                        </button>
                    `;
                    break;
                case 'void':
                    buttons = `
                        <span class="px-4 py-2 text-sm text-gray-500">Voided Invoice</span>
                    `;
                    break;
            }

            container.innerHTML = buttons;
        }

        // Initialize
        if (invoiceId) {
            fetchInvoice();
        } else {
            alert('No invoice ID provided');
            window.location.href = 'invoices.html';
        }
    </script>
</body>
</html>
