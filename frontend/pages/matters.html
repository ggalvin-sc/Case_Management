<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matters - Case Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <h1 class="text-xl font-bold text-gray-800">Case Management</h1>
                    </div>
                    <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                        <a href="../index.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="matters.html" class="border-blue-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Matters
                        </a>
                        <a href="billing.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Time Entry
                        </a>
                        <a href="expenses.html" class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                            Expenses
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    <span class="text-sm text-gray-700 mr-4" id="userDisplay">User</span>
                    <button onclick="logout()" class="text-sm text-gray-500 hover:text-gray-700">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-900">Matters</h2>
            <button onclick="showNewMatterModal()" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded">
                <i class="fas fa-plus mr-2"></i>New Matter
            </button>
        </div>

        <!-- Filters -->
        <div class="bg-white shadow rounded-lg p-4 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Search</label>
                    <input type="text" id="searchInput" placeholder="Matter name or number..." class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                    <select id="statusFilter" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        <option value="">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="closed">Closed</option>
                        <option value="on_hold">On Hold</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Attorney</label>
                    <select id="attorneyFilter" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        <option value="">All Attorneys</option>
                        <!-- Populated dynamically -->
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="applyFilters()" class="w-full bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded text-sm">
                        <i class="fas fa-filter mr-2"></i>Apply Filters
                    </button>
                </div>
            </div>
        </div>

        <!-- Matters Table -->
        <div class="bg-white shadow rounded-lg overflow-hidden">
            <div class="px-6 py-4 border-b">
                <div class="flex items-center space-x-3">
                    <div class="flex-1 relative">
                        <input type="text" id="searchInput" placeholder="Search matters..." class="w-full border border-gray-300 rounded-md pl-10 pr-3 py-2 text-sm">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    </div>
                    <button onclick="clearSearch()" class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50">
                        Clear
                    </button>
                </div>
            </div>
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortTable('matter_number')">
                            Matter # <i class="fas fa-sort ml-1"></i>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortTable('client_name')">
                            Client <i class="fas fa-sort ml-1"></i>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortTable('name')">
                            Matter Name <i class="fas fa-sort ml-1"></i>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortTable('status')">
                            Status <i class="fas fa-sort ml-1"></i>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortTable('attorney_name')">
                            Attorney <i class="fas fa-sort ml-1"></i>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer hover:bg-gray-100" onclick="sortTable('unbilled_amount')">
                            Unbilled <i class="fas fa-sort ml-1"></i>
                        </th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="mattersTableBody" class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td colspan="7" class="px-6 py-8 text-center text-gray-500">Loading matters...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- New Matter Modal -->
    <div id="newMatterModal" class="hidden fixed inset-0 bg-gray-500 bg-opacity-75 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b">
                <h3 class="text-lg font-medium text-gray-900">New Matter</h3>
            </div>
            <form id="newMatterForm" class="px-6 py-4 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Client</label>
                        <select id="clientSelect" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            <option value="">Select Client...</option>
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Matter Name *</label>
                        <input type="text" id="matterName" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                    <textarea id="matterDescription" rows="3" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Matter Type</label>
                        <select id="matterType" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            <option value="">Select Type...</option>
                            <option value="litigation">Litigation</option>
                            <option value="corporate">Corporate</option>
                            <option value="real_estate">Real Estate</option>
                            <option value="family">Family Law</option>
                            <option value="criminal">Criminal</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Responsible Attorney</label>
                        <select id="responsibleAttorney" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            <option value="">Select Attorney...</option>
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Billing Type *</label>
                        <select id="billingType" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            <option value="hourly">Hourly</option>
                            <option value="flat_fee">Flat Fee</option>
                            <option value="contingency">Contingency</option>
                            <option value="mixed">Mixed</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Hourly Rate</label>
                        <input type="number" id="hourlyRate" step="0.01" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Open Date *</label>
                    <input type="date" id="openDate" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="hideNewMatterModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-md text-sm font-medium">
                        Create Matter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allMatters = [];
        let filteredMatters = [];
        let sortColumn = 'matter_number';
        let sortDirection = 'asc';
        let searchTerm = '';

        async function loadMatters() {
            try {
                allMatters = await api.get('/matters');
                filteredMatters = allMatters;
                applyFilters();
            } catch (error) {
                console.error('Error loading matters:', error);
                document.getElementById('mattersTableBody').innerHTML = `
                    <tr><td colspan="7" class="px-6 py-8 text-center text-red-500">Error loading matters</td></tr>
                `;
            }
        }

        function applyFilters() {
            const clientId = document.getElementById('clientFilter').value;
            const status = document.getElementById('statusFilter').value;
            const attorneyId = document.getElementById('attorneyFilter').value;

            filteredMatters = allMatters.filter(matter => {
                // Apply filters
                if (clientId && matter.client_id != clientId) return false;
                if (status && matter.status !== status) return false;
                if (attorneyId && matter.attorney_id != attorneyId) return false;

                // Apply search
                if (searchTerm) {
                    const search = searchTerm.toLowerCase();
                    const matchesSearch =
                        (matter.matter_number && matter.matter_number.toLowerCase().includes(search)) ||
                        (matter.client_name && matter.client_name.toLowerCase().includes(search)) ||
                        (matter.name && matter.name.toLowerCase().includes(search)) ||
                        (matter.description && matter.description.toLowerCase().includes(search));
                    if (!matchesSearch) return false;
                }

                return true;
            });

            sortMatters();
            renderMatters(filteredMatters);
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }

            sortMatters();
            renderMatters(filteredMatters);
        }

        function sortMatters() {
            filteredMatters.sort((a, b) => {
                let aVal = a[sortColumn];
                let bVal = b[sortColumn];

                if (aVal == null) aVal = '';
                if (bVal == null) bVal = '';

                if (typeof aVal === 'string') aVal = aVal.toLowerCase();
                if (typeof bVal === 'string') bVal = bVal.toLowerCase();

                if (aVal < bVal) return sortDirection === 'asc' ? -1 : 1;
                if (aVal > bVal) return sortDirection === 'asc' ? 1 : -1;
                return 0;
            });
        }

        function performSearch() {
            searchTerm = document.getElementById('searchInput').value;
            applyFilters();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchTerm = '';
            applyFilters();
        }

        function renderMatters(matters) {
            const tbody = document.getElementById('mattersTableBody');

            if (matters.length === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="7" class="px-6 py-8 text-center text-gray-500">No matters found</td></tr>
                `;
                return;
            }

            tbody.innerHTML = matters.map(matter => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-blue-600">
                        <a href="matter-detail.html?id=${matter.id}">${matter.matter_number}</a>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${matter.client_name || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${matter.name}</td>
                    <td class="px-6 py-4 whitespace-nowrap">
                        <span class="px-2 py-1 text-xs font-semibold rounded-full ${getStatusColor(matter.status)}">
                            ${matter.status}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${matter.attorney_name || '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">$${(matter.unbilled_amount || 0).toFixed(2)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <a href="matter-detail.html?id=${matter.id}" class="text-blue-600 hover:text-blue-900 mr-3">View</a>
                        <button onclick="editMatter('${matter.id}')" class="text-green-600 hover:text-green-900 mr-3">Edit</button>
                        <button onclick="deleteMatter('${matter.id}')" class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusColor(status) {
            const colors = {
                'active': 'bg-green-100 text-green-800',
                'closed': 'bg-gray-100 text-gray-800',
                'on_hold': 'bg-yellow-100 text-yellow-800',
                'archived': 'bg-red-100 text-red-800',
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            const attorney = document.getElementById('attorneyFilter').value;

            const filtered = allMatters.filter(matter => {
                const matchesSearch = !search ||
                    matter.name.toLowerCase().includes(search) ||
                    matter.matter_number.toLowerCase().includes(search);
                const matchesStatus = !status || matter.status === status;
                const matchesAttorney = !attorney || matter.responsible_attorney_id === attorney;

                return matchesSearch && matchesStatus && matchesAttorney;
            });

            renderMatters(filtered);
        }

        function showNewMatterModal() {
            document.getElementById('newMatterModal').classList.remove('hidden');
            loadClients();
            loadAttorneys();
            document.getElementById('openDate').valueAsDate = new Date();
        }

        function hideNewMatterModal() {
            document.getElementById('newMatterModal').classList.add('hidden');
            document.getElementById('newMatterForm').reset();
        }

        async function loadClients() {
            try {
                const clients = await api.get('/clients');
                const select = document.getElementById('clientSelect');
                select.innerHTML = '<option value="">Select Client...</option>' +
                    clients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        async function loadAttorneys() {
            try {
                const users = await api.get('/users', { role: 'attorney' });
                const selects = [document.getElementById('responsibleAttorney'), document.getElementById('attorneyFilter')];
                selects.forEach(select => {
                    if (select) {
                        select.innerHTML = '<option value="">Select Attorney...</option>' +
                            users.map(u => `<option value="${u.id}">${u.first_name} ${u.last_name}</option>`).join('');
                    }
                });
            } catch (error) {
                console.error('Error loading attorneys:', error);
            }
        }

        document.getElementById('newMatterForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const data = {
                client_id: document.getElementById('clientSelect').value,
                name: document.getElementById('matterName').value,
                description: document.getElementById('matterDescription').value,
                matter_type: document.getElementById('matterType').value,
                responsible_attorney_id: document.getElementById('responsibleAttorney').value || null,
                billing_type: document.getElementById('billingType').value,
                hourly_rate: parseFloat(document.getElementById('hourlyRate').value) || null,
                open_date: document.getElementById('openDate').value,
            };

            try {
                await api.post('/matters', data);
                hideNewMatterModal();
                loadMatters();
                alert('Matter created successfully!');
            } catch (error) {
                alert('Error creating matter: ' + error.message);
            }
        });

        async function deleteMatter(id) {
            if (!confirm('Are you sure you want to delete this matter? This will also delete all associated time entries and expenses.')) {
                return;
            }

            try {
                await api.delete(`/matters/${id}`);
                loadMatters();
                alert('Matter deleted successfully');
            } catch (error) {
                alert('Error deleting matter: ' + error.message);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadMatters();
            loadAttorneys();

            // Search on input
            document.getElementById('searchInput').addEventListener('input', performSearch);
        });
    </script>
</body>
</html>
