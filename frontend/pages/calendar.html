<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar & Deadlines - Case Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Select2 for searchable dropdowns -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="../css/select2-tailwind.css">
    <script src="../js/nav.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/searchable-select.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <div id="app-nav"></div>
    <script>renderNav('calendar');</script>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-gray-900">Calendar & Deadlines</h2>
            <div class="flex space-x-3">
                <button onclick="toggleView()" id="viewToggle" class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded">
                    <i class="fas fa-list mr-2"></i>List View
                </button>
                <button onclick="openNewEventModal()" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded">
                    <i class="fas fa-plus mr-2"></i>New Event
                </button>
            </div>
        </div>

        <!-- View Tabs -->
        <div class="mb-6">
            <div class="border-b border-gray-200">
                <nav class="-mb-px flex space-x-8">
                    <button onclick="setFilter('all')" id="tab-all" class="tab-btn border-b-2 border-blue-500 py-4 px-1 text-sm font-medium text-blue-600">
                        All Events
                    </button>
                    <button onclick="setFilter('deadline')" id="tab-deadline" class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Deadlines
                    </button>
                    <button onclick="setFilter('court_date')" id="tab-court_date" class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Court Dates
                    </button>
                    <button onclick="setFilter('appointment')" id="tab-appointment" class="tab-btn border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
                        Appointments
                    </button>
                </nav>
            </div>
        </div>

        <!-- Calendar View -->
        <div id="calendarView" class="bg-white shadow rounded-lg p-6">
            <!-- Calendar Header -->
            <div class="flex justify-between items-center mb-6">
                <button onclick="previousMonth()" class="p-2 hover:bg-gray-100 rounded">
                    <i class="fas fa-chevron-left"></i>
                </button>
                <h3 id="currentMonth" class="text-xl font-semibold"></h3>
                <button onclick="nextMonth()" class="p-2 hover:bg-gray-100 rounded">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>

            <!-- Calendar Grid -->
            <div class="grid grid-cols-7 gap-1">
                <!-- Day headers -->
                <div class="text-center text-sm font-semibold text-gray-600 py-2">Sun</div>
                <div class="text-center text-sm font-semibold text-gray-600 py-2">Mon</div>
                <div class="text-center text-sm font-semibold text-gray-600 py-2">Tue</div>
                <div class="text-center text-sm font-semibold text-gray-600 py-2">Wed</div>
                <div class="text-center text-sm font-semibold text-gray-600 py-2">Thu</div>
                <div class="text-center text-sm font-semibold text-gray-600 py-2">Fri</div>
                <div class="text-center text-sm font-semibold text-gray-600 py-2">Sat</div>
                <!-- Calendar days will be inserted here -->
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1 mt-2">
                <!-- Days populated by JavaScript -->
            </div>
        </div>

        <!-- List View -->
        <div id="listView" class="hidden">
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Title</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Matter</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Priority</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="eventsList" class="bg-white divide-y divide-gray-200">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- New Event Modal -->
    <div id="eventModal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-2xl shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-semibold text-gray-900">New Event</h3>
                <button onclick="closeEventModal()" class="text-gray-400 hover:text-gray-500">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="eventForm" onsubmit="saveEvent(event)">
                <input type="hidden" id="eventId">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Event Type *</label>
                        <select id="eventType" required class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="deadline">Deadline</option>
                            <option value="court_date">Court Date</option>
                            <option value="hearing">Hearing</option>
                            <option value="filing_deadline">Filing Deadline</option>
                            <option value="discovery_deadline">Discovery Deadline</option>
                            <option value="statute_date">Statute of Limitations</option>
                            <option value="appointment">Appointment</option>
                            <option value="meeting">Meeting</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Title *</label>
                        <input type="text" id="eventTitle" required class="w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
                        <textarea id="eventDescription" rows="3" class="w-full border border-gray-300 rounded-md px-3 py-2"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Matter</label>
                        <select id="eventMatter" class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="">Select Matter</option>
                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                        <select id="eventPriority" class="w-full border border-gray-300 rounded-md px-3 py-2">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                            <option value="critical">Critical</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Event Date *</label>
                        <input type="date" id="eventDate" required class="w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Event Time</label>
                        <input type="time" id="eventTime" class="w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
                        <input type="date" id="endDate" class="w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">End Time</label>
                        <input type="time" id="endTime" class="w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                        <input type="text" id="eventLocation" class="w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Reminder (days before)</label>
                        <input type="number" id="reminderDays" min="0" class="w-full border border-gray-300 rounded-md px-3 py-2">
                    </div>

                    <div class="flex items-center">
                        <input type="checkbox" id="allDay" class="h-4 w-4 text-blue-600 border-gray-300 rounded">
                        <label for="allDay" class="ml-2 block text-sm text-gray-900">All Day Event</label>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeEventModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-md text-sm font-medium">
                        Save Event
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentView = 'calendar';
        let currentDate = new Date();
        let currentFilter = 'all';
        let allEvents = [];
        let allMatters = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            requireAuth();
            await loadMatters();
            await loadEvents();
            renderCalendar();
        });

        async function loadMatters() {
            const response = await apiCall('/api/v1/matters');
            if (response.ok) {
                allMatters = response.data;
                const select = document.getElementById('eventMatter');
                select.innerHTML = '<option value="">Select Matter</option>';
                allMatters.forEach(matter => {
                    const option = document.createElement('option');
                    option.value = matter.id;
                    option.textContent = `${matter.matter_number} - ${matter.matter_name}`;
                    select.appendChild(option);
                });
            }
        }

        async function loadEvents() {
            const params = currentFilter !== 'all' ? `?event_type=${currentFilter}` : '';
            const response = await apiCall(`/api/v1/calendar/events${params}`);
            if (response.ok) {
                allEvents = response.data;
                if (currentView === 'calendar') {
                    renderCalendar();
                } else {
                    renderList();
                }
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            // Update month display
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('currentMonth').textContent = `${monthNames[month]} ${year}`;

            // Get first day of month and number of days
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Get events for this month
            const monthStart = `${year}-${String(month + 1).padStart(2, '0')}-01`;
            const monthEnd = `${year}-${String(month + 1).padStart(2, '0')}-${String(daysInMonth).padStart(2, '0')}`;
            const monthEvents = allEvents.filter(e => e.event_date >= monthStart && e.event_date <= monthEnd);

            // Build calendar grid
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            // Empty cells before first day
            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(createEmptyDay());
            }

            // Days of month
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dayEvents = monthEvents.filter(e => e.event_date === dateStr);
                grid.appendChild(createDay(day, dayEvents, dateStr));
            }
        }

        function createEmptyDay() {
            const div = document.createElement('div');
            div.className = 'border border-gray-200 p-2 h-24 bg-gray-50';
            return div;
        }

        function createDay(day, events, dateStr) {
            const div = document.createElement('div');
            const isToday = dateStr === new Date().toISOString().split('T')[0];
            div.className = `border border-gray-200 p-2 h-24 hover:bg-gray-50 cursor-pointer ${isToday ? 'bg-blue-50' : 'bg-white'}`;
            div.onclick = () => openNewEventModalWithDate(dateStr);

            const dayNum = document.createElement('div');
            dayNum.className = `text-sm font-semibold ${isToday ? 'text-blue-600' : 'text-gray-700'}`;
            dayNum.textContent = day;
            div.appendChild(dayNum);

            events.forEach(event => {
                const eventDiv = document.createElement('div');
                const priorityColors = {
                    low: 'bg-gray-200 text-gray-800',
                    medium: 'bg-blue-200 text-blue-800',
                    high: 'bg-orange-200 text-orange-800',
                    critical: 'bg-red-200 text-red-800'
                };
                eventDiv.className = `text-xs px-1 py-0.5 rounded mt-1 truncate ${priorityColors[event.priority] || 'bg-gray-200'}`;
                eventDiv.textContent = event.title;
                eventDiv.onclick = (e) => {
                    e.stopPropagation();
                    viewEvent(event.id);
                };
                div.appendChild(eventDiv);
            });

            return div;
        }

        function renderList() {
            const tbody = document.getElementById('eventsList');
            tbody.innerHTML = '';

            if (allEvents.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="px-6 py-4 text-center text-gray-500">No events found</td></tr>';
                return;
            }

            allEvents.forEach(event => {
                const row = document.createElement('tr');
                const matter = allMatters.find(m => m.id === event.matter_id);

                const priorityColors = {
                    low: 'bg-gray-100 text-gray-800',
                    medium: 'bg-blue-100 text-blue-800',
                    high: 'bg-orange-100 text-orange-800',
                    critical: 'bg-red-100 text-red-800'
                };

                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        ${formatDate(event.event_date)}${event.event_time ? ` ${event.event_time}` : ''}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2 py-1 rounded-full text-xs ${getTypeColor(event.event_type)}">
                            ${formatEventType(event.event_type)}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${event.title}</td>
                    <td class="px-6 py-4 text-sm text-gray-500">${matter ? matter.matter_number : '-'}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <span class="px-2 py-1 rounded-full text-xs ${priorityColors[event.priority]}">
                            ${event.priority}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        ${event.completed ? '<span class="text-green-600"><i class="fas fa-check-circle"></i> Completed</span>' : '<span class="text-gray-500">Pending</span>'}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm">
                        <button onclick="editEvent(${event.id})" class="text-blue-600 hover:text-blue-900 mr-3">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteEvent(${event.id})" class="text-red-600 hover:text-red-900">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function getTypeColor(type) {
            const colors = {
                deadline: 'bg-red-100 text-red-800',
                court_date: 'bg-purple-100 text-purple-800',
                appointment: 'bg-green-100 text-green-800',
                hearing: 'bg-orange-100 text-orange-800',
                filing_deadline: 'bg-pink-100 text-pink-800',
                discovery_deadline: 'bg-yellow-100 text-yellow-800',
                statute_date: 'bg-red-200 text-red-900',
                meeting: 'bg-blue-100 text-blue-800',
                other: 'bg-gray-100 text-gray-800'
            };
            return colors[type] || colors.other;
        }

        function formatEventType(type) {
            return type.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function toggleView() {
            currentView = currentView === 'calendar' ? 'list' : 'calendar';
            const calView = document.getElementById('calendarView');
            const listView = document.getElementById('listView');
            const btn = document.getElementById('viewToggle');

            if (currentView === 'calendar') {
                calView.classList.remove('hidden');
                listView.classList.add('hidden');
                btn.innerHTML = '<i class="fas fa-list mr-2"></i>List View';
                renderCalendar();
            } else {
                calView.classList.add('hidden');
                listView.classList.remove('hidden');
                btn.innerHTML = '<i class="fas fa-calendar mr-2"></i>Calendar View';
                renderList();
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'text-blue-600');
                btn.classList.add('border-transparent', 'text-gray-500');
            });
            document.getElementById(`tab-${filter}`).classList.remove('border-transparent', 'text-gray-500');
            document.getElementById(`tab-${filter}`).classList.add('border-blue-500', 'text-blue-600');
            loadEvents();
        }

        function previousMonth() {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        }

        function nextMonth() {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        }

        function openNewEventModal() {
            document.getElementById('modalTitle').textContent = 'New Event';
            document.getElementById('eventForm').reset();
            document.getElementById('eventId').value = '';
            document.getElementById('eventModal').classList.remove('hidden');
        }

        function openNewEventModalWithDate(dateStr) {
            openNewEventModal();
            document.getElementById('eventDate').value = dateStr;
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        async function saveEvent(e) {
            e.preventDefault();

            const eventId = document.getElementById('eventId').value;
            const data = {
                event_type: document.getElementById('eventType').value,
                title: document.getElementById('eventTitle').value,
                description: document.getElementById('eventDescription').value,
                matter_id: document.getElementById('eventMatter').value || null,
                priority: document.getElementById('eventPriority').value,
                event_date: document.getElementById('eventDate').value,
                event_time: document.getElementById('eventTime').value || null,
                end_date: document.getElementById('endDate').value || null,
                end_time: document.getElementById('endTime').value || null,
                location: document.getElementById('eventLocation').value || null,
                reminder_days: document.getElementById('reminderDays').value || null,
                all_day: document.getElementById('allDay').checked ? 1 : 0
            };

            const url = eventId ? `/api/v1/calendar/events/${eventId}` : '/api/v1/calendar/events';
            const method = eventId ? 'PATCH' : 'POST';

            const response = await apiCall(url, method, data);
            if (response.ok) {
                closeEventModal();
                await loadEvents();
                showNotification('Event saved successfully');
            } else {
                alert('Error saving event: ' + (response.data?.message || 'Unknown error'));
            }
        }

        async function editEvent(id) {
            const response = await apiCall(`/api/v1/calendar/events/${id}`);
            if (response.ok) {
                const event = response.data;
                document.getElementById('modalTitle').textContent = 'Edit Event';
                document.getElementById('eventId').value = event.id;
                document.getElementById('eventType').value = event.event_type;
                document.getElementById('eventTitle').value = event.title;
                document.getElementById('eventDescription').value = event.description || '';
                document.getElementById('eventMatter').value = event.matter_id || '';
                document.getElementById('eventPriority').value = event.priority;
                document.getElementById('eventDate').value = event.event_date;
                document.getElementById('eventTime').value = event.event_time || '';
                document.getElementById('endDate').value = event.end_date || '';
                document.getElementById('endTime').value = event.end_time || '';
                document.getElementById('eventLocation').value = event.location || '';
                document.getElementById('reminderDays').value = event.reminder_days || '';
                document.getElementById('allDay').checked = event.all_day === 1;
                document.getElementById('eventModal').classList.remove('hidden');
            }
        }

        async function viewEvent(id) {
            editEvent(id);
        }

        async function deleteEvent(id) {
            if (!confirm('Are you sure you want to delete this event?')) return;

            const response = await apiCall(`/api/v1/calendar/events/${id}`, 'DELETE');
            if (response.ok) {
                await loadEvents();
                showNotification('Event deleted successfully');
            }
        }

        function showNotification(message) {
            // Simple notification - you can enhance this
            alert(message);
        }
    </script>
</body>
</html>
