<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Entry - Case Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Select2 for searchable dropdowns -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="../css/select2-tailwind.css">
    <script src="../js/nav.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/searchable-select.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <div id="app-nav"></div>
    <script>renderNav('billing');</script>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Time Entry Form -->
            <div class="lg:col-span-2">
                <div class="bg-white shadow rounded-lg p-6">
                    <h2 class="text-xl font-bold text-gray-900 mb-6">Log Time Entry</h2>

                    <form id="timeEntryForm" class="space-y-6">
                        <!-- Date -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Date *</label>
                            <input type="date" id="entryDate" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                        </div>

                        <!-- Client Filter -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Filter by Client</label>
                            <select id="clientFilter" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                                <option value="">All Clients</option>
                            </select>
                        </div>

                        <!-- Matter Selection -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Matter *</label>
                            <select id="matterSelect" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                                <option value="">Select Matter...</option>
                            </select>
                        </div>

                        <!-- Activity Code -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Activity</label>
                            <select id="activityCode" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                                <option value="">Select matter first...</option>
                            </select>
                        </div>

                        <!-- Duration Input -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Duration (Hours) *</label>
                            <input type="number" id="duration" min="0" step="0.1" placeholder="e.g., 1.5 for 1 hour 30 minutes" required class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                            <p class="text-xs text-gray-500 mt-1">Enter decimal hours (e.g., 0.5 = 30 min, 1.25 = 1 hr 15 min)</p>
                        </div>

                        <!-- Description -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Description *</label>
                            <textarea id="description" required rows="4" placeholder="Detailed description of work performed..." class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm"></textarea>
                            <p class="text-xs text-gray-500 mt-1">Be specific about the work performed</p>
                        </div>

                        <!-- Rate & Billable -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Hourly Rate</label>
                                <div class="bg-gray-50 border border-gray-200 rounded-md px-3 py-2">
                                    <span id="hourlyRateDisplay" class="text-sm text-gray-600">$0.00</span>
                                </div>
                                <input type="hidden" id="hourlyRate">
                                <p class="text-xs text-gray-500 mt-1">From matter settings</p>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Billable</label>
                                <select id="billable" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
                                    <option value="true">Billable</option>
                                    <option value="false">Non-Billable</option>
                                </select>
                            </div>
                        </div>

                        <!-- Calculated Amount -->
                        <div class="bg-gray-50 rounded-md p-4">
                            <div class="flex justify-between items-center">
                                <span class="text-sm font-medium text-gray-700">Calculated Amount:</span>
                                <span id="calculatedAmount" class="text-2xl font-bold text-gray-900">$0.00</span>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="flex space-x-3 pt-4 border-t">
                            <button type="submit" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded">
                                <i class="fas fa-save mr-2"></i>Save Entry
                            </button>
                            <button type="button" onclick="resetForm()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                                Clear
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Recent Entries -->
            <div class="lg:col-span-1">
                <div class="bg-white shadow rounded-lg p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Recent Entries</h3>
                    <div id="recentEntries" class="space-y-3">
                        <p class="text-sm text-gray-500 text-center py-4">Loading...</p>
                    </div>
                </div>

                <!-- Quick Timer -->
                <div class="bg-white shadow rounded-lg p-6 mt-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Quick Timer</h3>
                    <div class="text-center">
                        <div class="text-4xl font-bold text-gray-900 mb-4" id="timerDisplay">00:00:00</div>
                        <div class="space-y-2">
                            <button id="timerBtn" onclick="toggleTimer()" class="w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded">
                                <i class="fas fa-play mr-2"></i>Start Timer
                            </button>
                            <button onclick="saveTimer()" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded" id="saveTimerBtn" disabled>
                                <i class="fas fa-save mr-2"></i>Save to Entry
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let timerInterval = null;
        let timerSeconds = 0;
        let timerRunning = false;
        let allMatters = [];
        let allClients = [];

        async function loadClients() {
            try {
                allClients = await api.get('/clients');
                const select = document.getElementById('clientFilter');
                select.innerHTML = '<option value="">All Clients</option>' +
                    allClients.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

                // Refresh Select2 dropdown
                if (typeof refreshSelect === 'function') {
                    refreshSelect('clientFilter');
                }
            } catch (error) {
                console.error('Error loading clients:', error);
            }
        }

        async function loadMatters() {
            try {
                allMatters = await api.get('/matters', { status: 'active' });
                filterMatters();

                // Pre-select if matter_id in URL
                const urlParams = new URLSearchParams(window.location.search);
                const matterId = urlParams.get('matter_id');
                if (matterId) {
                    // Wait for Select2 to initialize
                    setTimeout(() => {
                        $('#matterSelect').val(matterId).trigger('change');
                    }, 700);
                }
            } catch (error) {
                console.error('Error loading matters:', error);
            }
        }

        function filterMatters() {
            const clientId = document.getElementById('clientFilter').value;
            const select = document.getElementById('matterSelect');

            let filteredMatters = allMatters;
            if (clientId) {
                filteredMatters = allMatters.filter(m => m.client_id == clientId);
            }

            select.innerHTML = '<option value="">Select Matter...</option>' +
                filteredMatters.map(m => {
                    const clientName = m.client_name || 'Unknown Client';
                    return `<option value="${m.id}" data-rate="${m.hourly_rate || ''}" data-client="${m.client_id}">${clientName} - ${m.name} (${m.matter_number})</option>`;
                }).join('');

            // Refresh Select2 dropdown
            if (typeof refreshSelect === 'function') {
                refreshSelect('matterSelect');
            }
        }

        async function loadRecentEntries() {
            try {
                const entries = await api.get('/time-entries', { limit: 5, orderBy: 'entry_date', order: 'DESC' });
                const container = document.getElementById('recentEntries');

                if (entries.length === 0) {
                    container.innerHTML = '<p class="text-sm text-gray-500 text-center py-4">No recent entries</p>';
                    return;
                }

                container.innerHTML = entries.map(entry => `
                    <div class="border-b pb-3 last:border-0">
                        <p class="text-sm font-medium text-gray-900">${entry.matter_name}</p>
                        <p class="text-xs text-gray-500">${formatDate(entry.entry_date)} - ${(entry.duration_minutes / 60).toFixed(2)}h</p>
                        <p class="text-xs text-gray-600 mt-1">${truncate(entry.description, 50)}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading recent entries:', error);
            }
        }

        async function updateRate() {
            const select = document.getElementById('matterSelect');
            const matterId = select.value;

            // Get the selected option (works with both regular select and Select2)
            const selectedOption = select.querySelector(`option[value="${matterId}"]`);
            const rate = selectedOption ? selectedOption.getAttribute('data-rate') : null;

            // Use rate from matter, or default to $350 if not set
            const finalRate = rate && parseFloat(rate) > 0 ? parseFloat(rate) : 350;

            document.getElementById('hourlyRate').value = finalRate;
            document.getElementById('hourlyRateDisplay').textContent = formatCurrency(finalRate);

            // Load activities for selected matter
            if (matterId) {
                await loadActivitiesForMatter(matterId);
            } else {
                document.getElementById('activityCode').innerHTML = '<option value="">Select matter first...</option>';
                // Refresh Select2 for activity dropdown
                if (typeof refreshSelect === 'function') {
                    refreshSelect('activityCode');
                }
            }

            calculateAmount();
        }

        async function loadActivitiesForMatter(matterId) {
            try {
                // In Kimai, we need to get activities filtered by project
                const response = await fetch(`https://kimai-glg-u11035.vm.elestio.app/api/activities?project=${matterId}`, {
                    headers: {
                        'Authorization': 'Bearer 00d1c3f02410b298ac3bc2624',
                        'Accept': 'application/json'
                    }
                });
                const activities = await response.json();

                const select = document.getElementById('activityCode');
                if (activities.length === 0) {
                    select.innerHTML = '<option value="">No activities for this matter</option>';
                } else {
                    select.innerHTML = '<option value="">Select Activity...</option>' +
                        activities.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
                }

                // Refresh Select2 dropdown
                if (typeof refreshSelect === 'function') {
                    refreshSelect('activityCode');
                }
            } catch (error) {
                console.error('Error loading activities:', error);
                document.getElementById('activityCode').innerHTML = '<option value="">Error loading activities</option>';
                // Refresh Select2 dropdown even on error
                if (typeof refreshSelect === 'function') {
                    refreshSelect('activityCode');
                }
            }
        }

        function calculateAmount() {
            const duration = parseFloat(document.getElementById('duration').value) || 0;
            const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;

            const amount = duration * rate;

            document.getElementById('calculatedAmount').textContent = formatCurrency(amount);
        }


        function toggleTimer() {
            if (timerRunning) {
                // Stop timer
                clearInterval(timerInterval);
                timerRunning = false;
                document.getElementById('timerBtn').innerHTML = '<i class="fas fa-play mr-2"></i>Start Timer';
                document.getElementById('timerBtn').className = 'w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded';
                document.getElementById('saveTimerBtn').disabled = false;
            } else {
                // Start timer
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTimerDisplay();
                }, 1000);
                timerRunning = true;
                document.getElementById('timerBtn').innerHTML = '<i class="fas fa-stop mr-2"></i>Stop Timer';
                document.getElementById('timerBtn').className = 'w-full bg-red-500 hover:bg-red-600 text-white font-medium py-2 px-4 rounded';
                document.getElementById('saveTimerBtn').disabled = true;
            }
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;

            document.getElementById('timerDisplay').textContent =
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function saveTimer() {
            if (timerSeconds === 0) return;

            const decimalHours = (timerSeconds / 3600).toFixed(2);
            document.getElementById('duration').value = decimalHours;

            calculateAmount();

            // Reset timer
            timerSeconds = 0;
            updateTimerDisplay();
            document.getElementById('saveTimerBtn').disabled = true;
        }

        function resetForm() {
            document.getElementById('timeEntryForm').reset();
            document.getElementById('entryDate').valueAsDate = new Date();
            document.getElementById('calculatedAmount').textContent = '$0.00';
        }

        document.getElementById('timeEntryForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const duration = parseFloat(document.getElementById('duration').value) || 0;
            const durationMinutes = Math.round(duration * 60);

            if (durationMinutes === 0) {
                alert('Please enter a duration');
                return;
            }

            const data = {
                matter_id: document.getElementById('matterSelect').value,
                entry_date: document.getElementById('entryDate').value,
                duration_minutes: durationMinutes,
                description: document.getElementById('description').value,
                activity_code: document.getElementById('activityCode').value,
                hourly_rate: parseFloat(document.getElementById('hourlyRate').value) || null,
                billable: document.getElementById('billable').value === 'true',
            };

            try {
                await api.post('/time-entries', data);
                alert('Time entry saved successfully!');
                resetForm();
                loadRecentEntries();
            } catch (error) {
                alert('Error saving time entry: ' + error.message);
            }
        });

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }

        function formatDate(dateString) {
            return new Date(dateString).toLocaleDateString();
        }

        function truncate(str, length) {
            return str.length > length ? str.substring(0, length) + '...' : str;
        }

        // Event listeners
        // Use Select2 events with jQuery (wait for Select2 initialization)
        setTimeout(() => {
            $('#clientFilter').on('change', filterMatters);
            $('#matterSelect').on('change', updateRate);
        }, 600);
        document.getElementById('duration').addEventListener('input', calculateAmount);

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadClients();
            loadMatters();
            loadRecentEntries();
            document.getElementById('entryDate').valueAsDate = new Date();
        });
    </script>
</body>
</html>
