<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Management - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Select2 for searchable dropdowns -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" href="css/select2-tailwind.css">
    <script src="js/nav.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/searchable-select.js"></script>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <div id="app-nav"></div>
    <script>renderNav('dashboard');</script>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-4 mb-8">
            <!-- Active Matters -->
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-briefcase text-3xl text-blue-500"></i>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Active Matters</dt>
                                <dd class="flex items-baseline">
                                    <div class="text-2xl font-semibold text-gray-900" id="activeMatters">0</div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Unbilled Time -->
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-clock text-3xl text-green-500"></i>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Unbilled Hours</dt>
                                <dd class="flex items-baseline">
                                    <div class="text-2xl font-semibold text-gray-900" id="unbilledHours">0</div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Unbilled Amount -->
            <a href="pages/unbilled-time.html" class="bg-white overflow-hidden shadow rounded-lg hover:shadow-md transition-shadow cursor-pointer">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-dollar-sign text-3xl text-yellow-500"></i>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">Unbilled Amount</dt>
                                <dd class="flex items-baseline">
                                    <div class="text-2xl font-semibold text-gray-900" id="unbilledAmount">$0</div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </a>

            <!-- Total Revenue -->
            <div class="bg-white overflow-hidden shadow rounded-lg">
                <div class="p-5">
                    <div class="flex items-center">
                        <div class="flex-shrink-0">
                            <i class="fas fa-chart-line text-3xl text-purple-500"></i>
                        </div>
                        <div class="ml-5 w-0 flex-1">
                            <dl>
                                <dt class="text-sm font-medium text-gray-500 truncate">This Month</dt>
                                <dd class="flex items-baseline">
                                    <div class="text-2xl font-semibold text-gray-900" id="monthRevenue">$0</div>
                                </dd>
                            </dl>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upcoming Deadlines -->
        <div class="bg-white shadow rounded-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-medium text-gray-900">
                    <i class="fas fa-calendar-exclamation text-red-500 mr-2"></i>Upcoming Deadlines
                </h3>
                <a href="pages/calendar.html" class="text-sm text-blue-600 hover:text-blue-800">
                    View All <i class="fas fa-arrow-right ml-1"></i>
                </a>
            </div>
            <div id="upcomingDeadlines" class="space-y-3">
                <!-- Deadlines will be loaded here -->
                <p class="text-gray-500 text-center py-4">Loading deadlines...</p>
            </div>
        </div>

        <!-- Quick Actions & Recent Activity -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Quick Actions -->
            <div class="lg:col-span-1">
                <div class="bg-white shadow rounded-lg p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Quick Actions</h3>
                    <div class="space-y-3">
                        <a href="pages/matters.html?action=new" class="block w-full bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded text-center">
                            <i class="fas fa-plus mr-2"></i>New Matter
                        </a>
                        <a href="pages/billing.html?action=new" class="block w-full bg-green-500 hover:bg-green-600 text-white font-medium py-2 px-4 rounded text-center">
                            <i class="fas fa-clock mr-2"></i>Log Time
                        </a>
                        <a href="pages/expenses.html?action=new" class="block w-full bg-yellow-500 hover:bg-yellow-600 text-white font-medium py-2 px-4 rounded text-center">
                            <i class="fas fa-receipt mr-2"></i>Add Expense
                        </a>
                    </div>
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="lg:col-span-2">
                <div class="bg-white shadow rounded-lg p-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Recent Activity</h3>
                    <div id="recentActivity" class="space-y-4">
                        <!-- Activity items will be loaded here -->
                        <p class="text-gray-500 text-center py-8">Loading activity...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Load dashboard data
        async function loadDashboard() {
            try {
                const stats = await api.get('/dashboard/stats');

                document.getElementById('activeMatters').textContent = stats.activeMatters || 0;
                document.getElementById('unbilledHours').textContent = stats.unbilledHours || 0;
                document.getElementById('unbilledAmount').textContent = formatCurrency(stats.unbilledAmount || 0);
                document.getElementById('monthRevenue').textContent = formatCurrency(stats.monthRevenue || 0);

                loadRecentActivity();
                loadUpcomingDeadlines();
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        async function loadUpcomingDeadlines() {
            try {
                const response = await apiCall('/api/v1/calendar/upcoming?days=14&limit=5');
                const container = document.getElementById('upcomingDeadlines');

                if (!response.ok || response.data.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-4">No upcoming deadlines</p>';
                    return;
                }

                const deadlines = response.data;
                container.innerHTML = deadlines.map(deadline => {
                    const daysUntil = getDaysUntil(deadline.event_date);
                    const urgencyClass = daysUntil <= 3 ? 'bg-red-50 border-red-200' : daysUntil <= 7 ? 'bg-yellow-50 border-yellow-200' : 'bg-blue-50 border-blue-200';
                    const urgencyText = daysUntil === 0 ? 'Today' : daysUntil === 1 ? 'Tomorrow' : `${daysUntil} days`;
                    const priorityColors = {
                        low: 'text-gray-600',
                        medium: 'text-blue-600',
                        high: 'text-orange-600',
                        critical: 'text-red-600'
                    };

                    return `
                        <div class="flex items-center justify-between p-3 border ${urgencyClass} rounded-lg">
                            <div class="flex-1">
                                <div class="flex items-center">
                                    <i class="fas fa-calendar-day ${priorityColors[deadline.priority]} mr-2"></i>
                                    <span class="font-medium text-gray-900">${deadline.title}</span>
                                </div>
                                <div class="mt-1 text-sm text-gray-600">
                                    ${deadline.matter_name ? `<span class="font-medium">${deadline.matter_number}</span> - ` : ''}
                                    ${formatDate(deadline.event_date)}${deadline.event_time ? ` at ${deadline.event_time}` : ''}
                                </div>
                                ${deadline.location ? `<div class="mt-1 text-xs text-gray-500"><i class="fas fa-map-marker-alt mr-1"></i>${deadline.location}</div>` : ''}
                            </div>
                            <div class="ml-4 text-right">
                                <span class="text-sm font-semibold ${daysUntil <= 3 ? 'text-red-600' : daysUntil <= 7 ? 'text-yellow-600' : 'text-blue-600'}">
                                    ${urgencyText}
                                </span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading deadlines:', error);
                document.getElementById('upcomingDeadlines').innerHTML = '<p class="text-gray-500 text-center py-4">Error loading deadlines</p>';
            }
        }

        function getDaysUntil(dateStr) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const eventDate = new Date(dateStr + 'T00:00:00');
            const diffTime = eventDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            return Math.max(0, diffDays);
        }

        async function loadRecentActivity() {
            try {
                const activities = await api.get('/dashboard/activity');
                const container = document.getElementById('recentActivity');

                if (activities.length === 0) {
                    container.innerHTML = '<p class="text-gray-500 text-center py-8">No recent activity</p>';
                    return;
                }

                container.innerHTML = activities.map(activity => `
                    <div class="flex items-start space-x-3 pb-4 border-b last:border-0">
                        <div class="flex-shrink-0">
                            <i class="fas ${getActivityIcon(activity.type)} text-gray-400"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm text-gray-900">${activity.description}</p>
                            <p class="text-sm text-gray-500">${formatDate(activity.timestamp)}</p>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading activity:', error);
            }
        }


        function getActivityIcon(type) {
            const icons = {
                'time_entry': 'fa-clock',
                'expense': 'fa-receipt',
                'invoice': 'fa-file-invoice',
                'matter': 'fa-briefcase',
            };
            return icons[type] || 'fa-circle';
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(amount);
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 60) return `${diffMins} minutes ago`;
            if (diffHours < 24) return `${diffHours} hours ago`;
            if (diffDays < 7) return `${diffDays} days ago`;
            return date.toLocaleDateString();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadDashboard();
        });
    </script>
</body>
</html>
